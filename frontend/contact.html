<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — RAYZE</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><span class="logo-mark"></span>RAYZE.</a>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="work.html">Portfolio &amp; Reviews</a></li>
        <li><a href="careers.html">Careers</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu">Menu</button>
  </div>
</header>

<main>

  <section class="hero">
    <div class="container">
      <h1>Let's start<br>something.</h1>
      <p class="lede">Tell us about your brand and what you're trying to launch, grow, or fix.
        We read every message ourselves.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container" style="max-width:640px;">
      <form id="contact-form">
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required maxlength="200">
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required maxlength="320">
        </div>

        <div class="form-field">
          <label for="company">Company (optional)</label>
          <input type="text" id="company" name="company" maxlength="200">
        </div>

        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required maxlength="5000"></textarea>
        </div>

        <!-- Honeypot: real visitors never see or fill this in. -->
        <div class="form-field honeypot-field" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="btn btn-primary">Send message</button>
        <div id="contact-status" class="form-status"></div>
      </form>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">

  </div>

<script type="module" src="js/contact.js"></script>
</body>
</html>
