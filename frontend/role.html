<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="nav-bar">
      <a href="index.html" class="logo"><img src="logos/mark-red.png" class="logo-mark-img" alt="RAYZE">RAYZE.</a>
      <nav>
        <span class="nav-highlight" aria-hidden="true"></span>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="work.html">Portfolio &amp; Reviews</a></li>
          <li><a href="careers.html">Careers</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="section" style="padding-top: 140px;">
    <div class="container" style="max-width: 760px;">
      <a href="careers.html" class="back-link">&larr; All open roles</a>

      <div id="job-detail">
        <p>Loading role…</p>
      </div>

      <form id="apply-form" style="margin-top:48px; display:none;">
        <h3 style="margin-bottom: 24px;">Apply for this role</h3>

        <div class="form-field">
          <label for="applicant_name">Full name</label>
          <input type="text" id="applicant_name" name="applicant_name" required maxlength="200">
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required maxlength="320">
        </div>

        <div class="form-field">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" name="phone" maxlength="50">
        </div>

        <div class="form-field">
          <label for="cover_letter">Cover letter (optional)</label>
          <textarea id="cover_letter" name="cover_letter" maxlength="5000"></textarea>
        </div>

        <div class="form-field">
          <label for="resume">Resume (PDF, JPG, or PNG)</label>
          <input type="file" id="resume" name="resume" accept=".pdf,.jpg,.jpeg,.png" required>
        </div>

        <!-- Honeypot: real applicants never see or fill this in. -->
        <div class="form-field honeypot-field" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="btn btn-primary">Submit application</button>
        <div id="apply-status" class="form-status"></div>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-brand">
      <img src="logos/mark-red.png" class="logo-mark-img" alt="RAYZE">
      <span class="footer-tagline">Rise with RAYZE.</span>
    </div>
    <div class="footer-meta">
      <span>&copy; 2026 RAYZE. All rights reserved.</span>
      <span>Prototype build — not final copy or imagery.</span>
    </div>
  </div>
</footer>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/role.js"></script>
</body>
</html>
